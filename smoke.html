<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter bundle smoke test</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 p-6 text-slate-950 sm:p-10">
    <main class="mx-auto flex max-w-2xl flex-col gap-8">
      <header class="select-none">
        <p class="text-sm font-semibold uppercase tracking-widest text-slate-500">
          Web component smoke test
        </p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight">Light-DOM counters</h1>
      </header>

      <div class="grid gap-4">
        <section class="grid gap-2 sm:grid-cols-[8rem_1fr] sm:items-center">
          <h2 class="select-none font-semibold text-slate-700">Vanilla</h2>
          <vanilla-counter
            id="smoke-vanilla-counter"
            class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm"
            data-testid="smoke-vanilla-counter"
            default-value="-3"
          >
            <vanilla-counter-minus-button
              id="smoke-vanilla-minus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-vanilla-minus-button"
            ></vanilla-counter-minus-button>
            <vanilla-counter-label
              id="smoke-vanilla-label"
              class="min-w-8 text-center font-mono text-lg"
              data-testid="smoke-vanilla-label"
            ></vanilla-counter-label>
            <vanilla-counter-plus-button
              id="smoke-vanilla-plus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-vanilla-plus-button"
            ></vanilla-counter-plus-button>
          </vanilla-counter>
        </section>

        <section class="grid gap-2 sm:grid-cols-[8rem_1fr] sm:items-center">
          <h2 class="select-none font-semibold text-slate-700">SolidJS</h2>
          <solid-counter
            id="smoke-solid-counter"
            class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm"
            data-testid="smoke-solid-counter"
            default-value="-2"
          >
            <solid-counter-minus-button
              id="smoke-solid-minus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-solid-minus-button"
            ></solid-counter-minus-button>
            <solid-counter-label
              id="smoke-solid-label"
              class="min-w-8 text-center font-mono text-lg"
              data-testid="smoke-solid-label"
            ></solid-counter-label>
            <solid-counter-plus-button
              id="smoke-solid-plus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-solid-plus-button"
            ></solid-counter-plus-button>
          </solid-counter>
        </section>

        <section class="grid gap-2 sm:grid-cols-[8rem_1fr] sm:items-center">
          <h2 class="select-none font-semibold text-slate-700">Atomico</h2>
          <atomico-counter
            id="smoke-atomico-counter"
            class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm"
            data-testid="smoke-atomico-counter"
            default-value="-1"
          >
            <atomico-counter-minus-button
              id="smoke-atomico-minus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-atomico-minus-button"
            ></atomico-counter-minus-button>
            <atomico-counter-label
              id="smoke-atomico-label"
              class="min-w-8 text-center font-mono text-lg"
              data-testid="smoke-atomico-label"
            ></atomico-counter-label>
            <atomico-counter-plus-button
              id="smoke-atomico-plus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-atomico-plus-button"
            ></atomico-counter-plus-button>
          </atomico-counter>
        </section>

        <section class="grid gap-2 sm:grid-cols-[8rem_1fr] sm:items-center">
          <h2 class="select-none font-semibold text-slate-700">Preact</h2>
          <preact-counter
            id="smoke-preact-counter"
            class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm"
            data-testid="smoke-preact-counter"
            default-value="1"
          >
            <preact-counter-minus-button
              id="smoke-preact-minus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-preact-minus-button"
            ></preact-counter-minus-button>
            <preact-counter-label
              id="smoke-preact-label"
              class="min-w-8 text-center font-mono text-lg"
              data-testid="smoke-preact-label"
            ></preact-counter-label>
            <preact-counter-plus-button
              id="smoke-preact-plus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-preact-plus-button"
            ></preact-counter-plus-button>
          </preact-counter>
        </section>

        <section class="grid gap-2 sm:grid-cols-[8rem_1fr] sm:items-center">
          <h2 class="select-none font-semibold text-slate-700">Lit</h2>
          <lit-counter
            id="smoke-lit-counter"
            class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm"
            data-testid="smoke-lit-counter"
            default-value="2"
          >
            <lit-counter-minus-button
              id="smoke-lit-minus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-lit-minus-button"
            ></lit-counter-minus-button>
            <lit-counter-label
              id="smoke-lit-label"
              class="min-w-8 text-center font-mono text-lg"
              data-testid="smoke-lit-label"
            ></lit-counter-label>
            <lit-counter-plus-button
              id="smoke-lit-plus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-lit-plus-button"
            ></lit-counter-plus-button>
          </lit-counter>
        </section>

        <section class="grid gap-2 sm:grid-cols-[8rem_1fr] sm:items-center">
          <h2 class="select-none font-semibold text-slate-700">Svelte</h2>
          <svelte-counter
            id="smoke-svelte-counter"
            class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm"
            data-testid="smoke-svelte-counter"
            default-value="3"
          >
            <svelte-counter-minus-button
              id="smoke-svelte-minus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-svelte-minus-button"
            ></svelte-counter-minus-button>
            <svelte-counter-label
              id="smoke-svelte-label"
              class="min-w-8 text-center font-mono text-lg"
              data-testid="smoke-svelte-label"
            ></svelte-counter-label>
            <svelte-counter-plus-button
              id="smoke-svelte-plus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-svelte-plus-button"
            ></svelte-counter-plus-button>
          </svelte-counter>
        </section>

        <section class="grid gap-2 sm:grid-cols-[8rem_1fr] sm:items-center">
          <h2 class="select-none font-semibold text-slate-700">Vanilla optimized</h2>
          <o-c
            id="smoke-optimized-counter"
            class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm"
            data-testid="smoke-optimized-counter"
            default-value="4"
          >
            <o-m
              id="smoke-optimized-minus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-optimized-minus-button"
            ></o-m>
            <o-l
              id="smoke-optimized-label"
              class="min-w-8 text-center font-mono text-lg"
              data-testid="smoke-optimized-label"
            ></o-l>
            <o-p
              id="smoke-optimized-plus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-optimized-plus-button"
            ></o-p>
          </o-c>
        </section>
        <section class="grid gap-2 sm:grid-cols-[8rem_1fr] sm:items-center">
          <h2 class="select-none font-semibold text-slate-700">
            Vanilla optimized manual
          </h2>
          <manually-optimized-counter
            id="smoke-manual-counter"
            class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm"
            data-testid="smoke-manual-counter"
          >
            <button
              is="manually-optimized-counter-minus-button"
              id="smoke-manual-minus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-manual-minus-button"
            ></button>
            <manually-optimized-counter-label
              is="manually-optimized-counter-label"
              id="smoke-manual-label"
              class="min-w-8 text-center font-mono text-lg"
              data-testid="smoke-manual-label"
            ></manually-optimized-counter-label>
            <button
              is="manually-optimized-counter-plus-button"
              id="smoke-manual-plus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="smoke-manual-plus-button"
            ></button>
          </manually-optimized-counter>
        </section>

      </div>

      <section class="grid gap-3 rounded-2xl border border-blue-200 bg-blue-50 p-4">
        <div>
          <p class="select-none text-sm font-semibold uppercase tracking-wider text-blue-700">
            Controlled mode
          </p>
          <h2 class="select-none mt-1 font-semibold text-slate-900">Vanilla</h2>
        </div>
        <div class="flex flex-wrap items-center gap-4">
          <vanilla-counter
            id="controlled-vanilla-counter"
            class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm"
            data-testid="controlled-vanilla-counter"
            value="5"
          >
            <vanilla-counter-minus-button
              id="controlled-vanilla-minus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="controlled-vanilla-minus-button"
            ></vanilla-counter-minus-button>
            <vanilla-counter-label
              id="controlled-vanilla-label"
              class="min-w-8 text-center font-mono text-lg"
              data-testid="controlled-vanilla-label"
            ></vanilla-counter-label>
            <vanilla-counter-plus-button
              id="controlled-vanilla-plus-button"
              class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700"
              data-testid="controlled-vanilla-plus-button"
            ></vanilla-counter-plus-button>
          </vanilla-counter>
          <p class="text-sm text-slate-600">
            Consumer value:
            <output
              id="controlled-value"
              class="font-mono font-bold text-blue-700"
              data-testid="controlled-value"
              >5</output
            >
          </p>
        </div>
      </section>

      <section class="grid gap-3">
        <div>
          <p class="select-none text-sm font-semibold uppercase tracking-wider text-slate-500">
            Additive suites
          </p>
          <h2 class="select-none mt-1 font-semibold">All seven implementations</h2>
        </div>
        <div
          id="suite-grid"
          class="grid grid-cols-1 gap-4"
          data-testid="suite-grid"
        ></div>
      </section>

      <output
        id="smoke-result"
        class="rounded-lg border border-slate-200 bg-white px-4 py-3 font-mono text-sm font-semibold text-slate-700"
        data-testid="smoke-result"
        >Running…</output
      >
      <div id="smoke-fixtures" class="hidden" data-testid="smoke-fixtures"></div>
    </main>

    <script type="module">
      import "./packages/web-components-vanilla/dist/vanilla-counter.js";
      import "./packages/web-components-solidjs/dist/solid-counter.js";
      import "./packages/web-components-atomico/dist/atomico-counter.js";
      import "./packages/web-components-preact/dist/preact-counter.js";
      import "./packages/web-components-lit/dist/lit-counter.js";
      import "./packages/web-components-svelte/dist/svelte-counter.js";
      import "./packages/web-components-vanilla-optimized/dist/optimized-counter.js";
      import "./packages/web-components-vanilla-optimized-manual/dist/optimized-counter.js";

      const controlledCounter = document.querySelector("#controlled-vanilla-counter");
      const controlledValue = document.querySelector("#controlled-value");
      const result = document.querySelector("#smoke-result");
      const fixtures = document.querySelector("#smoke-fixtures");
      const suiteGrid = document.querySelector("#suite-grid");

      controlledCounter.onChange = (value) => {
        controlledCounter.value = value;
        controlledValue.value = String(value);
      };

      const nextFrame = () => new Promise(requestAnimationFrame);

      async function waitFor(readValue, expected, description) {
        // Slow framework initialization is allowed, but a missing render must fail clearly.
        for (let frame = 0; frame < 20; frame += 1) {
          if (readValue() === expected) return;
          await nextFrame();
        }

        throw new Error(`${description}: expected ${expected}, received ${readValue()}`);
      }

      async function exerciseTags([counterTag, minusTag, labelTag, plusTag]) {
        await Promise.all(
          [counterTag, minusTag, labelTag, plusTag].map((tag) => customElements.whenDefined(tag)),
        );

        const counter = document.createElement(counterTag);
        counter.defaultValue = 0;
        counter.innerHTML = `<${minusTag}></${minusTag}><${labelTag}></${labelTag}><${plusTag}></${plusTag}>`;
        fixtures.append(counter);

        const minusHost = counter.querySelector(minusTag);
        const labelHost = counter.querySelector(labelTag);
        const plusHost = counter.querySelector(plusTag);

        await waitFor(
          () => labelHost.querySelector("span")?.textContent.trim(),
          "0",
          `${counterTag} initial label`,
        );
        await waitFor(
          () => Boolean(minusHost.querySelector("button")),
          true,
          `${minusTag} inner button`,
        );
        await waitFor(
          () => Boolean(plusHost.querySelector("button")),
          true,
          `${plusTag} inner button`,
        );

        minusHost.querySelector("button").click();
        await waitFor(
          () => labelHost.querySelector("span")?.textContent.trim(),
          "-1",
          `${counterTag} decrement`,
        );

        plusHost.querySelector("button").click();
        await waitFor(
          () => labelHost.querySelector("span")?.textContent.trim(),
          "0",
          `${counterTag} first increment`,
        );
        plusHost.querySelector("button").click();
        await waitFor(
          () => labelHost.querySelector("span")?.textContent.trim(),
          "1",
          `${counterTag} second increment`,
        );

        counter.remove();
      }

      async function exercise(prefix) {
        const counterTag = `${prefix}-counter`;
        await exerciseTags([
          counterTag,
          `${counterTag}-minus-button`,
          `${counterTag}-label`,
          `${counterTag}-plus-button`,
        ]);
      }
      async function exerciseManual() {
        const names = {
          minus: "manually-optimized-counter-minus-button",
          label: "manually-optimized-counter-label",
          plus: "manually-optimized-counter-plus-button",
        };
        await Promise.all(
          Object.values(names).map((name) => customElements.whenDefined(name)),
        );

        const minus = document.querySelector("#smoke-manual-minus-button");
        const label = document.querySelector("#smoke-manual-label");
        const plus = document.querySelector("#smoke-manual-plus-button");
        if (!minus || !label || !plus) {
          throw new Error("manual smoke fixture is incomplete");
        }


        await waitFor(
          () => minus.getAttribute("aria-label"),
          "Remove count",
          "manual minus-button upgrade",
        );
        await waitFor(
          () => minus.dataset.testid,
          "smoke-manual-minus-button",
          "manual consumer test id",
        );
        await waitFor(() => minus.textContent, "-", "manual minus-button content");
        await waitFor(() => label.getAttribute("aria-live"), "polite", "manual label upgrade");
        await waitFor(
          () => plus.getAttribute("aria-label"),
          "Add count",
          "manual plus-button upgrade",
        );
        await waitFor(() => plus.textContent, "+", "manual plus-button content");

        if (minus.children.length || label.children.length || plus.children.length) {
          throw new Error("manual controls rendered nested elements");
        }
      }

      async function exerciseSuites(prefix) {
        const card = document.createElement("article");
        card.className =
          "grid min-w-0 grid-cols-1 gap-4 rounded-xl border border-slate-200 bg-white p-4 text-sm shadow-sm";
        card.innerHTML = `
          <div class="flex min-w-0 items-baseline justify-between gap-2">
            <h3 class="select-none font-semibold capitalize text-slate-900">${prefix}</h3>
            <span class="select-none text-xs text-slate-500">6 suites</span>
          </div>
          <${prefix}-accordion class="grid min-w-0 grid-cols-1 gap-2"><${prefix}-accordion-item value="details" class="block min-w-0"><${prefix}-accordion-trigger class="group flex w-full min-w-0 cursor-pointer items-center justify-between gap-2 rounded-lg border border-slate-200 px-3 py-2 text-left font-medium transition hover:bg-slate-100">Details<span aria-hidden="true" class="inline-block text-slate-400 transition group-aria-expanded:rotate-180">▾</span></${prefix}-accordion-trigger><${prefix}-accordion-panel class="min-w-0 rounded-lg bg-slate-50 px-3 py-2 text-slate-700">Selectable panel</${prefix}-accordion-panel></${prefix}-accordion-item></${prefix}-accordion>
          <${prefix}-modal class="flex min-w-0 flex-wrap items-center gap-2"><${prefix}-modal-trigger class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700">Modal</${prefix}-modal-trigger><${prefix}-modal-popup class="m-auto rounded-xl border border-slate-200 bg-white p-4 text-slate-900 shadow-lg backdrop:bg-slate-950/50 [&:not(dialog):not([hidden]):not([data-open])]:contents">Modal content <${prefix}-modal-close class="cursor-pointer rounded-lg border border-slate-200 bg-slate-100 px-2 py-1 text-slate-700 transition hover:bg-slate-200">Close</${prefix}-modal-close></${prefix}-modal-popup></${prefix}-modal>
          <${prefix}-popover side="bottom" side-offset="4" class="flex min-w-0 flex-wrap items-center gap-2"><${prefix}-popover-trigger class="cursor-pointer rounded-lg bg-slate-900 px-3 py-1 text-white transition hover:bg-slate-700">Popover</${prefix}-popover-trigger><${prefix}-popover-popup class="m-0 rounded-xl border border-slate-200 bg-white p-4 text-slate-900 shadow-lg [&:not([popover])]:contents">Popover content <${prefix}-popover-close class="cursor-pointer rounded-lg border border-slate-200 bg-slate-100 px-2 py-1 text-slate-700 transition hover:bg-slate-200">Close</${prefix}-popover-close></${prefix}-popover-popup></${prefix}-popover>
          <label class="flex select-none items-center gap-2 text-slate-700">Choice <${prefix}-toggle-checkbox aria-label="${prefix} choice" class="size-4 accent-slate-900"></${prefix}-toggle-checkbox></label>
          <${prefix}-otp-field length="4" validation-type="numeric" name="${prefix}-code" class="flex min-w-0 gap-2 [&>input]:size-10 [&>input]:rounded-lg [&>input]:border [&>input]:border-slate-300 [&>input]:bg-white [&>input]:text-center [&>input]:font-mono [&>input]:text-lg [&>input]:outline-none [&>input]:focus:border-slate-900 [&>input]:focus:ring-2 [&>input]:focus:ring-slate-900/20"></${prefix}-otp-field>
          <${prefix}-tabs class="grid min-w-0 grid-cols-1 gap-2"><${prefix}-tabs-list class="flex min-w-0 gap-1 border-b border-slate-200"><${prefix}-tab value="one" class="cursor-pointer rounded-t-lg border-b-2 border-transparent px-3 py-1.5 text-slate-500 transition hover:text-slate-900 aria-selected:border-slate-900 aria-selected:font-semibold aria-selected:text-slate-900">One</${prefix}-tab><${prefix}-tab value="two" class="cursor-pointer rounded-t-lg border-b-2 border-transparent px-3 py-1.5 text-slate-500 transition hover:text-slate-900 aria-selected:border-slate-900 aria-selected:font-semibold aria-selected:text-slate-900">Two</${prefix}-tab></${prefix}-tabs-list><${prefix}-tab-panel value="one" class="min-w-0 rounded-lg border border-slate-200 p-3 text-slate-700">First panel</${prefix}-tab-panel><${prefix}-tab-panel value="two" class="min-w-0 rounded-lg border border-slate-200 p-3 text-slate-700">Second panel</${prefix}-tab-panel></${prefix}-tabs>`;
        suiteGrid.append(card);

        const tags = [
          "accordion",
          "accordion-trigger",
          "modal",
          "modal-trigger",
          "modal-popup",
          "modal-close",
          "popover",
          "popover-trigger",
          "popover-popup",
          "popover-close",
          "toggle-checkbox",
          "otp-field",
          "tabs",
          "tabs-list",
          "tab",
          "tab-panel",
        ];
        await Promise.all(tags.map((tag) => customElements.whenDefined(`${prefix}-${tag}`)));
        await nextFrame();

        card.querySelector(`${prefix}-accordion-trigger > button`).click();
        const accordionPanel = card.querySelector(`${prefix}-accordion-panel`);
        if (accordionPanel.hidden) throw new Error(`${prefix} accordion did not open`);

        card.querySelector(`${prefix}-toggle-checkbox > input`).click();
        const toggle = card.querySelector(`${prefix}-toggle-checkbox > input`);
        if (!toggle.checked) throw new Error(`${prefix} checkbox did not toggle`);

        card.querySelectorAll(`${prefix}-tab > button`)[1].click();
        const tabPanels = card.querySelectorAll(`${prefix}-tab-panel`);
        if (!tabPanels[0].hidden || tabPanels[1].hidden) {
          throw new Error(`${prefix} tabs did not select`);
        }
      }

      try {
        for (const prefix of ["vanilla", "solid", "atomico", "preact", "lit", "svelte"]) {
          await exercise(prefix);
        }
        await exerciseTags(["o-c", "o-m", "o-l", "o-p"]);
        await exerciseManual();
        for (const prefix of ["vanilla", "o", "solid", "atomico", "preact", "lit", "svelte"]) {
          await exerciseSuites(prefix);
        }

        result.value = "PASS: counters, manual built-in hosts, and 42 light-DOM suites work";
        result.classList.remove("text-slate-700");
        result.classList.add("border-emerald-200", "bg-emerald-50", "text-emerald-700");
        result.dataset.status = "pass";
      } catch (error) {
        result.value = `FAIL: ${error.message}`;
        result.classList.remove("text-slate-700");
        result.classList.add("border-rose-200", "bg-rose-50", "text-rose-700");
        result.dataset.status = "fail";
        throw error;
      }
    </script>
  </body>
</html>
